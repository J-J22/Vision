<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script><script src="/tw.js"></script>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css">
</head>
<body>
  <main class="container">
    <h1>Log in or sign up</h1>
    <form id="form">
      <label>Email <input id="email" type="email" required></label>
      <label>Name (sign up only) <input id="name"></label>
      <label>Password <input id="password" type="password" required minlength="6"></label>
      <div class="row">
        <button type="submit" data-mode="login">Log in</button>
        <button type="submit" class="secondary" data-mode="register">Sign up</button>
      </div>
      <p id="message" class="error"></p>
    </form>
  </main>
  <script src="/site.js"></script>
  <script src="/app.js"></script>
  <script>
    renderNav();
    const form = document.getElementById("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const mode = e.submitter?.dataset.mode ?? "login";
      try {
        const data = await api(`/api/auth/${mode}`, {
          method: "POST",
          body: { email: email.value, password: password.value, name: document.getElementById("name").value },
        });
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        location.href = "/";
      } catch (err) {
        document.getElementById("message").textContent = err.message;
      }
    });
  </script>
</body>
</html>
